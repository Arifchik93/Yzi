<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шаблон протокола УЗИ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="page__header">
      <h1>Пример заполнения протокола УЗИ</h1>
      <p class="page__subtitle">
        Выберите шаблон, заполните поля и сразу редактируйте итоговый текст протокола.
      </p>
    </header>

    <section class="protocol-picker">
      <label for="protocolSelect">Шаблон протокола</label>
      <select id="protocolSelect"></select>
      <div class="protocol-actions">
        <button type="button" class="icon-button" data-template-action="refresh" aria-label="Обновить шаблон" title="Обновить шаблон">⟳</button>
        <button type="button" class="icon-button" data-template-action="edit" aria-label="Открыть локальный шаблон" title="Открыть локальный шаблон">✎</button>
        <button type="button" class="icon-button" data-template-action="download" aria-label="Скачать локальную версию" title="Скачать локальную версию">⬇</button>
      </div>
      <span id="loadStatus" class="status">Загрузка...</span>
    </section>

    <section>
      <div id="formContainer" class="form"></div>
    </section>

    <section class="output">
      <label for="protocolOutput">Итоговый протокол (можно редактировать вручную)</label>
      <textarea id="protocolOutput" rows="16"></textarea>
    </section>

    <section class="actions" data-actions>
      <button type="button" data-copy>Быстро скопировать</button>
      <button type="button" class="secondary" data-share="telegram">Отправить в Telegram</button>
      <button type="button" class="secondary" data-share="max">Отправить в Max</button>
    </section>
  </main>

  <div class="modal" id="templateEditor" aria-hidden="true">
    <div class="modal__backdrop" data-editor-close></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="templateEditorTitle">
      <div class="modal__header">
        <h2 id="templateEditorTitle">Редактор локального шаблона</h2>
        <button type="button" class="icon-button" data-editor-close aria-label="Закрыть">✕</button>
      </div>
      <p class="modal__subtitle">
        Измените JSON-шаблон и нажмите «Сохранить», чтобы применить локальную версию.
      </p>
      <textarea id="templateEditorTextarea" rows="14" class="modal__textarea"></textarea>
      <div class="modal__footer">
        <span id="templateEditorStatus" class="status"></span>
        <div class="modal__actions">
          <button type="button" class="secondary" data-editor-close>Отмена</button>
          <button type="button" data-editor-save>Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
